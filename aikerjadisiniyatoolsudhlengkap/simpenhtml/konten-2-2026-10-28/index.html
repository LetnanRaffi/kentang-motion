<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap');

#sub{position:absolute;left:80px;right:80px;bottom:500px;text-align:center;font:600 42px/1.34 "Nunito",system-ui,sans-serif;color:#FFFDF7;letter-spacing:-.1px;text-shadow:0 2px 6px rgba(0,0,0,.8),0 6px 18px rgba(0,0,0,.6),0 16px 44px rgba(0,0,0,.45);pointer-events:none;visibility:hidden}
#dbg input{width:420px}#dbg span{font-variant-numeric:tabular-nums;min-width:7ch}
</style>
</head>
<body>
<div id="err" style="position:fixed;left:0;top:0;color:#fff;background:#900;font:13px monospace;padding:10px;display:none;z-index:99;white-space:pre-wrap;max-width:100%"></div>
<div id="stage"><div id="world"><svg id="scene" width="1080" height="1920" viewBox="0 0 1080 1920" style="position:absolute;inset:0" font-family="Nunito,system-ui,sans-serif"></svg></div>
<div id="sub"></div>
<div id="dbg"><button id="dPlay">Pause</button><input id="dScrub" type="range" min="0" max="1000" value="0"><span id="dClock">0.00s</span></div></div>
<audio id="vo" src="" preload="auto"></audio>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
window.onerror=function(m,s,l,c,e){var d=document.getElementById('err');d.style.display='block';d.textContent=m+' @line '+l+':'+c+'\n'+((e&&e.stack)||'');};
</script>
<script>
const $=(s,r=document)=>r.querySelector(s);
const W=1080,H=1920,DUR=39.2,NS='http://www.w3.org/2000/svg',XL='http://www.w3.org/1999/xlink';
const C={cream:'#FFF3DC',paper:'#FFFDF5',maroon:'#4A0E0E',ink:'#1E1E1E',gold:'#C8A15A',gold2:'#EFD79A',
  skin:'#D4A574',skin2:'#C08B5E',navy:'#172E3C',deep:'#0E1D26',teal:'#237C80',mint:'#8DD3C3',
  blue:'#5AABB8',coral:'#E0714F',rust:'#C86545',wall:'#F1E6CE',wall2:'#DFD1B3',wood:'#A9764C',wood2:'#7E5433',
  metal:'#AEB9B7',green:'#7FA55C',green2:'#9DB874',red:'#C8433A',amber:'#E9A23B'};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);$('#stage').style.transform=`translate(-50%,-50%) scale(${s})`;}addEventListener('resize',fit);fit();

const S=$('#scene');
function N(tag,a={},p=S){const n=document.createElementNS(NS,tag);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n;}
const G=(a={},p=S)=>N('g',a,p),R=(x,y,w,h,f,rx=0,p=S,a={})=>N('rect',{x,y,width:w,height:h,rx,fill:f,...a},p),
  CI=(cx,cy,r,f,p=S,a={})=>N('circle',{cx,cy,r,fill:f,...a},p),EL=(cx,cy,rx,ry,f,p=S,a={})=>N('ellipse',{cx,cy,rx,ry,fill:f,...a},p),
  PA=(d,f,p=S,a={})=>N('path',{d,fill:f||'none',...a},p),
  LN=(d,st,w,p=S,a={})=>N('path',{d,fill:'none',stroke:st,'stroke-width':w,'stroke-linecap':'round','stroke-linejoin':'round',...a},p),
  TX=(x,y,t,size,f,p=S,a={})=>{const n=N('text',{x,y,'font-size':size,fill:f,'font-weight':800,'text-anchor':'middle','font-family':'Baloo 2,Nunito,sans-serif',...a},p);n.textContent=t;return n;},
  IMG=(href,x,y,w,h,p=S,a={})=>{const n=N('image',{x,y,width:w,height:h,...a},p);n.setAttributeNS(XL,'href',href);n.setAttribute('href',href);return n;},
  shadow=(x,y,rx,p=S,o=.14)=>EL(x,y,rx,18,C.deep,p,{opacity:o}),
  sh=(hex,f)=>{const n=parseInt(hex.slice(1),16);const r=Math.round(((n>>16)&255)*f),g=Math.round(((n>>8)&255)*f),b=Math.round((n&255)*f);return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);};
const rnd=(i)=>{const x=Math.sin(i*12.9898)*43758.5453;return x-Math.floor(x);};

/* SENDI: transform manual */
function J(el,tx=0,ty=0){const j={el,tx,ty,x:0,y:0,r:0,sx:1,sy:1,
  apply(){el.setAttribute('transform',`translate(${j.tx+j.x},${j.ty+j.y}) rotate(${j.r}) scale(${j.sx},${j.sy})`);}};j.apply();return j;}
/* rig(): pos dianimasikan x/y, j diputar — tidak saling menimpa */
const rig=(p,x=0,y=0)=>{const pos=G({transform:`translate(${x},${y})`},p);const el=G({},pos);return {pos,el,j:J(el)};};

const defsS=N('defs',{},S);
const gSky=N('linearGradient',{id:'skyG',x1:0,y1:0,x2:0,y2:1},defsS);
N('stop',{offset:0,'stop-color':'#9EC9D6'},gSky);N('stop',{offset:1,'stop-color':'#FBEFD8'},gSky);

const scenes=[];
function scene(name){const g=G({'data-name':name},S);g.style.display='none';const sc={name,g,cam:{x:540,y:960,z:1.1,ox:0,oy:0},
  apply(){const c=sc.cam;g.setAttribute('transform',`translate(${540-(c.x+c.ox)*c.z},${960-(c.y+c.oy)*c.z}) scale(${c.z})`);}};sc.apply();scenes.push(sc);return sc;}
const sky=(p)=>R(-900,-1800,2900,3800,'#BFDDE3',0,p);
const groundOf=(p,gy)=>{R(-900,gy+20,2900,900,C.wall2,0,p);R(-900,gy,2900,32,C.wood,0,p);R(-900,gy-8,2900,16,C.wood2,0,p);};

const HEADS={};
function character(p,x,ground,scale,{shirt=C.teal,pants=C.navy,shoes='#2C2A2E',hair=C.ink,skin=C.skin,tie=null}={}){
  const sd=shadow(x,ground+6,80*scale,p),place=G({transform:`translate(${x},${ground}) scale(${scale})`},p),rootEl=G({},place),root=J(rootEl),ref={root,place,scale,sd};
  for(const side of ['R','L']){const sx=side==='L'?-26:26,dk=side==='R'?.86:1;
    const tEl=G({},rootEl),thigh=J(tEl,sx,-214);R(-24,-10,48,118,sh(pants,dk),21,tEl);
    const sEl=G({},tEl),shin=J(sEl,0,102);R(-21,-8,42,108,sh(pants,dk),18,sEl);
    const fEl=G({},sEl),foot=J(fEl,0,96);PA('M -24 -10 L 16 -10 C 24 4 46 4 50 16 L 50 26 L -26 26 Z',sh(shoes,dk),fEl);
    ref[side+'thigh']=thigh;ref[side+'shin']=shin;ref[side+'foot']=foot;}
  const tEl=G({},rootEl),torso=J(tEl,0,-214);ref.torso=torso;
  const arm=(side,front)=>{const s=side==='L'?-1:1,aEl=G({},tEl),a=J(aEl,50*s,-126);R(-17,-16,34,98,front?sh(shirt,.95):sh(shirt,.84),16,aEl);
    const fEl=G({},aEl),f=J(fEl,0,78);R(-15,-12,30,90,front?skin:sh(skin,.9),14,fEl);const hEl=G({},fEl),h=J(hEl,0,74);EL(0,4,17,21,front?skin:sh(skin,.9),hEl);
    ref[side+'arm']=a;ref[side+'fore']=f;ref[side+'hand']=h;};
  arm('R',false);
  PA('M -48 -152 C -64 -144 -70 -112 -66 -76 L -58 8 C -28 22 32 22 60 8 L 67 -76 C 71 -112 60 -144 45 -152 Z',shirt,tEl);
  PA('M 46 -146 C 64 -130 68 -100 64 -62 L 57 8 L 36 12 L 40 -140 Z',sh(shirt,.88),tEl);R(-15,-178,30,40,skin,12,tEl);R(-58,-2,117,22,sh(shirt,.82),9,tEl);
  if(tie)PA('M -9 -150 L 9 -150 L 13 40 L 0 58 L -13 40 Z',tie,tEl);
  arm('L',true);
  const hEl=G({},tEl),head=J(hEl,0,-160);ref.head=head;ref.faces={};
  EL(-72,-70,13,20,skin,hEl);EL(72,-70,13,20,skin,hEl);
  PA('M -74 -120 C -74 -180 74 -180 74 -120 L 74 -60 C 74 -6 -74 -6 -74 -60 Z',skin,hEl);
  PA('M -76 -110 C -80 -175 80 -175 76 -110 L 62 -104 C 20 -130 -10 -120 -50 -108 Z',hair,hEl);
  const eyes=G({},hEl),ej=J(eyes,0,-86);ref.eyes=ej;
  ref.dots=G({},eyes);CI(-28,0,7,C.ink,ref.dots);CI(28,0,7,C.ink,ref.dots);
  ref.happy=G({opacity:0},hEl);
  LN('M -40 -80 Q -28 -96 -16 -80',C.ink,6,ref.happy);LN('M 16 -80 Q 28 -96 40 -80',C.ink,6,ref.happy);
  ref.wide=G({opacity:0},eyes);
  CI(-30,0,12,'#FFFDF5',ref.wide);CI(30,0,12,'#FFFDF5',ref.wide);CI(-29,1,6,C.ink,ref.wide);CI(31,1,6,C.ink,ref.wide);
  ref.brR=J(G({},hEl),-28,-101);LN('M -12 2 C -5 -4 5 -4 12 2',C.ink,5,ref.brR.el);
  ref.brL=J(G({},hEl),28,-101);LN('M -12 2 C -5 -4 5 -4 12 2',C.ink,5,ref.brL.el);
  ref.blush=G({opacity:0},hEl);EL(-52,-50,15,8,'#E58A6E',ref.blush,{opacity:.5});EL(52,-50,15,8,'#E58A6E',ref.blush,{opacity:.5});
  ref.sweat=EL(64,-96,5,8,'#9ED0EC',hEl,{opacity:0});
  ref.mouth=LN('M -16 -46 C -6 -36 6 -36 16 -46',C.ink,5,hEl);
  ref.mouthO=EL(0,-42,9,11,C.ink,hEl,{opacity:0});
  return ref;}

const tl=gsap.timeline({paused:true}),world=$('#world');
const show=(t,at,d=.5)=>tl.fromTo(t,{opacity:0},{opacity:1,duration:d,ease:'power2.out',immediateRender:false},at);
const hide=(t,at,d=.4)=>tl.to(t,{opacity:0,duration:d,ease:'power2.in'},at);
const rot=(j,at,v,dur,ease='power2.inOut')=>tl.to(j,{r:v,duration:dur,ease,onUpdate:j.apply},at);
const sway=(j,at,v,dur,base=0)=>tl.fromTo(j,{r:base},{r:base+v,duration:dur,ease:'sine.inOut',yoyo:true,repeat:-1,onUpdate:j.apply,immediateRender:false},at);
const spin=(j,at,period)=>{j.r=0;j.apply();tl.to(j,{r:360,duration:period,ease:'none',repeat:-1,onUpdate:j.apply},at);};
const drift=(el,at,{y=-200,scale=null,dur=3,peak=.8,dx=0}={})=>{
  const to={y,duration:dur,ease:'sine.out',repeat:-1,immediateRender:false};if(dx)to.x=dx;if(scale!=null)to.scale=scale;
  tl.fromTo(el,{y:0,x:0,scale:scale!=null?.5:1,transformOrigin:'50% 50%'},to,at);
  tl.fromTo(el,{opacity:0},{keyframes:{opacity:[0,peak,peak,0],easeEach:'none'},duration:dur,repeat:-1,ease:'none'},at);};
const cam=(sc,at,x,y,z,dur=1.6,ease='sine.inOut')=>tl.to(sc.cam,{x,y,z,duration:dur,ease,onUpdate:sc.apply},at);
const flash=(p,at,x,y,f,r=90)=>{const c=CI(x,y,10,f,p,{opacity:0});
  tl.fromTo(c,{opacity:.9,attr:{r:8}},{opacity:0,attr:{r},duration:.55,ease:'power2.out',immediateRender:false},at);};
function cut(at,from,to){tl.set(from.g,{display:'none'},at);tl.set(to.g,{display:'block'},at);}
function slide(at,from,to,axis='x',dist=96){
  const o=axis==='x'?'ox':'oy';
  tl.to(from.cam,{[o]:-dist,duration:.28,ease:'power2.in',onUpdate:from.apply},at);
  cut(at+.28,from,to);
  tl.set(to.cam,{[o]:dist},at+.28);
  tl.to(to.cam,{[o]:0,duration:.42,ease:'power3.out',onUpdate:to.apply},at+.28);
  const b={v:0};
  tl.to(b,{v:9,duration:.28,ease:'power2.in',onUpdate(){world.style.filter=`blur(${b.v.toFixed(2)}px)`;}},at);
  tl.to(b,{v:0,duration:.42,ease:'power3.out',onUpdate(){world.style.filter=b.v>.15?`blur(${b.v.toFixed(2)}px)`:'none';}},at+.28);}
function idle(ch,from){sway(ch.torso,from,1.2,1.7);sway(ch.head,from+.3,-1.8,2.3);
  const kf=[{duration:3.1},{duration:.02},{duration:.12},{duration:.02}];
  tl.fromTo(ch.eyes,{sy:1},{keyframes:kf.map((k,i)=>({sy:i===1||i===2?.06:1,...k})),repeat:-1,ease:'none',onUpdate:ch.eyes.apply},from);}
const MOUTH={
  senang:'M -16 -46 C -6 -36 6 -36 16 -46',
  cemas:'M -16 -38 C -6 -48 6 -48 16 -38',
  sedih:'M -18 -38 C -8 -50 8 -50 18 -38',
  ngomong:'M -13 -45 C -13 -33 13 -33 13 -45',
  kaget:'M -16 -46 C -6 -36 6 -36 16 -46'};
const face=(ch,e,at)=>{
  const happy=(e==='senang'||e==='tertawa')?1:0, wide=e==='kaget'?1:0, open=(e==='kaget'||e==='ngomong')?1:0;
  tl.to(ch.mouth,{attr:{d:MOUTH[e]||MOUTH.senang},duration:.1},at);
  tl.to(ch.dots,{opacity:1-happy-wide,duration:.1},at);
  tl.to(ch.happy,{opacity:happy,duration:.1},at);
  tl.to(ch.wide,{opacity:wide,duration:.1},at);
  tl.to(ch.mouth,{opacity:1-open,duration:.1},at);
  tl.to(ch.mouthO,{opacity:open,duration:.1},at);
  const br=(e==='cemas')?-12:(e==='kaget'||e==='tertawa')?-7:0;
  tl.to(ch.brR,{r:br,duration:.26,ease:'power2.out',onUpdate:ch.brR.apply},at);
  tl.to(ch.brL,{r:-br,duration:.26,ease:'power2.out',onUpdate:ch.brL.apply},at);
  tl.to(ch.blush,{opacity:happy?.5:0,duration:.3},at);
  tl.to(ch.sweat,{opacity:e==='cemas'?.85:0,duration:.3},at);};

/* ================= PANGGUNG 1 — RUANG PACKING ================= */
const P1=scene('packing');{
  const p=P1.g,gy=1640;
  R(-900,-1800,2900,3800,C.wall,0,p);
  R(-900,1470,2900,70,'#E8D9BC',0,p);
  // jendela
  R(70,380,330,360,C.paper,10,p,{stroke:C.wood2,'stroke-width':16});
  R(88,398,140,140,'#C6E0E6',0,p);R(244,398,140,140,'#BFD9E0',0,p);
  R(238,398,10,324,C.wood2,0,p);R(88,552,296,10,C.wood2,0,p);
  const curt=rig(p,400,380);R(-24,0,48,360,'#E7C9A2',14,curt.el);
  sway(curt.j,0.4,2.2,3.1);
  // rak + kardus
  R(640,470,400,22,C.wood,0,p);
  R(668,384,130,86,C.rust,8,p);R(684,398,98,10,'#F0D9B6',0,p);
  R(820,404,120,66,C.coral,8,p);R(836,416,88,10,'#F7E4C8',0,p);
  // lampu gantung
  const lamp=rig(p,470,240);LN('M0 -140 L0 40',C.ink,4,lamp.el);PA('M -56 40 L 56 40 L 32 96 L -32 96 Z',C.amber,lamp.el);
  EL(0,112,38,20,'#FFE9A8',lamp.el,{opacity:.45});
  sway(lamp.j,0.9,3.4,2.6);
  // rak roll bubble wrap
  R(120,806,340,18,C.wood,0,p);
  const rl1=rig(p,196,776);EL(0,0,40,32,C.mint,rl1.el);EL(0,0,16,13,C.wall,rl1.el);
  const rl2=rig(p,306,776);EL(0,0,40,32,C.paper,rl2.el);EL(0,0,16,13,C.wall2,rl2.el);
  const rl3=rig(p,404,776);EL(0,0,32,26,C.gold2,rl3.el);EL(0,0,13,10,C.wall,rl3.el);
  spin(rl1.j,0.8,3.4);spin(rl2.j,1.2,-4.1);spin(rl3.j,1.6,4.6);
  groundOf(p,gy);
  // tumpukan paket di lantai
  R(96,1500,200,140,C.rust,8,p);R(116,1382,160,120,C.amber,8,p);
  R(150,1290,110,92,C.coral,6,p);
  // Dika
  const dk=character(p,470,gy,1.06,{shirt:C.coral,pants:'#3B3F52'});
  idle(dk,0.2);
  // meja + panel depan
  R(70,1452,940,54,C.wood,10,p);
  R(70,1506,940,134,sh(C.wood,.84),0,p);
  R(70,1506,940,10,sh(C.wood,.7),0,p);
  // paket di atas meja
  const pk=[rig(p,210,1408),rig(p,700,1418),rig(p,858,1414)];
  pk.forEach((b,i)=>{R(-64,-44,128,88,i===1?C.amber:C.rust,6,b.el);R(-50,-30,100,14,'#F0DCBE',3,b.el);});
  // roll lakban berputar
  const tape=rig(p,600,1414);CI(0,0,38,C.mint,tape.el);CI(0,0,20,C.wall,tape.el);CI(0,0,7,C.wood2,tape.el);
  spin(tape.j,0.6,2.4);
  // printer label
  const pr=rig(p,880,1452);R(-58,-54,116,60,C.paper,8,pr.el,{stroke:C.navy,'stroke-width':3});
  R(-42,-28,84,10,C.ink,2,pr.el);const head=rig(pr.el,0,-28);R(-12,-12,24,24,C.navy,4,head.el);
  const lab=rig(p,880,1404);R(-30,-18,60,36,C.paper,3,lab.el,{stroke:C.ink,'stroke-width':2});
  // papan order
  const ord=rig(p,332,972);R(-120,-72,240,120,C.navy,14,ord.el);
  TX(4,-32,'ORDER HARI INI',18,'#9FB3BD',ord.el,{'font-family':'Nunito,sans-serif'});
  const ordT=TX(14,40,'37',58,C.mint,ord.el);
  TX(-76,38,'▮',28,C.gold,ord.el,{opacity:.9});
  // gerakan packing
  rot(dk.Rarm,0.3,-26,.5);rot(dk.Rarm,1.1,6,.5);rot(dk.Rarm,1.9,-24,.5);
  rot(dk.Larm,0.5,18,.6);rot(dk.Larm,1.5,2,.6);
  tl.to(ordT,{opacity:.35,duration:.14,yoyo:true,repeat:5},2.2);
  tl.to(pk[0].pos,{x:'+=10',duration:.9,yoyo:true,repeat:-1,ease:'sine.inOut'},0.8);
  tl.to(pk[1].pos,{y:'-=6',duration:1.1,yoyo:true,repeat:-1,ease:'sine.inOut'},1.2);
  tl.to(lab.pos,{y:'-=14',duration:1.4,yoyo:true,repeat:-1,ease:'sine.inOut'},1.0);
  tl.to(head.pos,{x:'+=14',duration:.5,yoyo:true,repeat:-1,ease:'sine.inOut'},0.6);
  // debu
  for(let i=0;i<5;i++){const d=CI(140+rnd(i)*720,1200+rnd(i+9)*260,3+rnd(i+3)*3,'#FFFDF5',p,{opacity:0});
    drift(d,0.4+i*.5,{y:-200,dur:4+rnd(i)*2,peak:.5});}
  // pintu (terpotong tepi kanan) + siluet retail
  R(806,880,300,760,C.wood2,8,p);
  R(832,906,280,734,'#101B21',4,p);
  const gWrap=G({transform:'translate(946,880)'},p);
  const giant=G({opacity:0,transform:'scale(.88)',transformOrigin:'50% 80%'},gWrap);
  PA('M -84 760 L -84 230 C -84 96 84 96 84 230 L 84 760 Z','#060D12',giant);
  CI(0,116,78,'#060D12',giant);
  CI(-26,102,7,'#EFD79A',giant,{opacity:.8});CI(28,102,7,'#EFD79A',giant,{opacity:.8});
  const gp=rig(giant,0,300);R(-66,-24,132,48,C.paper,6,gp.el);TX(0,10,'RETAIL',22,C.maroon,gp.el);
  tl.fromTo(giant,{opacity:0},{opacity:1,duration:.28,ease:'power3.out',immediateRender:false},2.9);
  flash(p,2.95,946,1520,'#FFFDF5',190);
  face(dk,'kaget',3.0);
  tl.to(pk[0].pos,{y:'+=150',rotation:-16,duration:.5,ease:'power2.in'},3.05);
  face(dk,'cemas',4.4);
  // kamera
  cam(P1,0,560,1190,1.24,.8,'none');
  cam(P1,2.0,590,1220,1.3,1.8,'sine.inOut');
  cam(P1,4.6,620,1250,1.38,2.4,'sine.inOut');
}

/* ================= PANGGUNG 2 — KERTAS SYARAT ================= */
const P2=scene('pintu');{
  const p=P2.g,gy=1640;
  R(-900,-1800,2900,3800,C.wall,0,p);
  R(-900,1470,2900,70,'#E8D9BC',0,p);
  groundOf(p,gy);
  // pintu
  R(600,700,360,940,C.wood2,10,p);
  R(626,726,308,888,'#101B21',4,p);
  const sWrap=G({transform:'translate(770,740)'},p);
  const sil=G({},sWrap);
  PA('M -66 900 L -66 210 C -66 96 66 96 66 210 L 66 900 Z','#060D12',sil);

const subEl=$('#sub');let subNow=-1;
function subUpdate(){const t=tl.time();let i=-1;
  for(let k=0;k<SUBS.length;k++)if(t>=SUBS[k][0]&&t<SUBS[k][1]){i=k;break;}
  if(i!==subNow){subNow=i;subEl.textContent=i<0?'':SUBS[i][2];subEl.style.visibility=i<0?'hidden':'visible';}}
gsap.ticker.add(subUpdate);

const q=new URLSearchParams(location.search),vo=$('#vo'),hasVO=!!vo.getAttribute('src');let audioOn=false;
function applyAll(){scenes.forEach(s=>s.apply());}
function start(){tl.play(0);if(hasVO){vo.currentTime=0;vo.play().then(()=>audioOn=true).catch(()=>{});}}
tl.eventCallback('onComplete',()=>start());
gsap.ticker.add(()=>{if(!audioOn||tl.paused())return;if(Math.abs(vo.currentTime-tl.time())>.12)vo.currentTime=tl.time();});
window.OPENER={W,H,DURATION:DUR,tl,ready:false,
  seek(t){tl.pause(t,false);applyAll();if(gsap.ticker.tick)gsap.ticker.tick();},play:start,scenes};
addEventListener('keydown',e=>{if(/^[rR]$/.test(e.key))start();if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
if(q.has('debug')){const dbg=$('#dbg');dbg.style.display='flex';const sc=$('#dScrub'),ck=$('#dClock');let drag=false;
  gsap.ticker.add(()=>{if(!drag)sc.value=String(tl.time()/DUR*1000);ck.textContent=tl.time().toFixed(2)+'s';$('#dPlay').textContent=tl.paused()?'Play':'Pause';});
  sc.addEventListener('pointerdown',()=>{drag=true;tl.pause();});addEventListener('pointerup',()=>drag=false);
  sc.addEventListener('input',()=>{tl.pause();tl.time(sc.value/1000*DUR);});$('#dPlay').onclick=()=>tl.paused()?tl.play():tl.pause();}
function boot(){applyAll();window.OPENER.ready=true;
  if(q.has('t')){tl.pause(parseFloat(q.get('t'))||0,false);applyAll();if(gsap.ticker.tick)gsap.ticker.tick();return;}
  if(q.has('clean'))return;start();}
boot();
document.fonts.ready.then(()=>{applyAll();});
